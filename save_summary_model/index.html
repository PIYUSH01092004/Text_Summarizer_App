<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer - AI Powered</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --secondary: #ec4899;
            --bg-color: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background elements */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(139, 92, 246, 0.3);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(236, 72, 153, 0.2);
            bottom: -200px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 2rem;
            padding: 3rem;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 400;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        textarea::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 10px 20px -10px rgba(139, 92, 246, 0.5);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(139, 92, 246, 0.7);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .elapsed {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .timeout-hint {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            display: none;
            animation: fadeUp 0.4s ease;
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }
        .btn-submit.loading .btn-text {
            display: none;
        }

        /* Output Section */
        .output-container {
            margin-top: 2rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--primary);
            border-radius: 16px;
            padding: 2rem;
            position: relative;
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }

        .output-container.visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
            animation: fadeUp 0.5s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 0.75rem;
        }

        .output-header h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .copy-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--surface-border);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
        }

        .summary-text {
            line-height: 1.8;
            font-size: 1.05rem;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        .error-message {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            display: none;
            font-size: 0.95rem;
        }

        @media (max-width: 640px) {
            .container { padding: 2rem 1.5rem; }
            h1 { font-size: 2rem; }
            textarea { height: 160px; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="container">
        <div class="header">
            <h1>Text Summarizer</h1>
            <p class="subtitle">Powered by HuggingFace T5 Transformer</p>
        </div>

        <form id="summarization-form">
            <div class="input-wrapper">
                <textarea 
                    id="dialogue-input" 
                    placeholder="Paste your long text, article, or dialogue here..." 
                    required></textarea>
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">
                <span class="btn-text">Generate Summary</span>
                <div class="spinner"></div>
                <span class="elapsed" id="elapsed-timer" style="display:none"></span>
            </button>
            <p class="timeout-hint" id="timeout-hint">⏳ T5 runs on CPU — this may take 15–45 seconds. Please wait…</p>
        </form>

        <div id="error-box" class="error-message"></div>

        <div id="output-box" class="output-container">
            <div class="output-header">
                <h3>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Summary Result
                </h3>
                <button class="copy-btn" id="copy-btn" title="Copy to clipboard">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy
                </button>
            </div>
            <div id="summary-text" class="summary-text"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById("summarization-form");
            const input = document.getElementById("dialogue-input");
            const submitBtn = document.getElementById("submit-btn");
            const outputBox = document.getElementById("output-box");
            const summaryText = document.getElementById("summary-text");
            const errorBox = document.getElementById("error-box");
            const copyBtn = document.getElementById("copy-btn");
            const elapsedTimer = document.getElementById("elapsed-timer");
            const timeoutHint = document.getElementById("timeout-hint");

            let elapsedInterval = null;
            let timeoutHintTimer = null;

            function startTimers() {
                let seconds = 0;
                elapsedTimer.style.display = 'inline';
                elapsedTimer.textContent = '0s';
                elapsedInterval = setInterval(() => {
                    seconds++;
                    elapsedTimer.textContent = `${seconds}s`;
                }, 1000);
                // Show hint after 30 seconds
                timeoutHintTimer = setTimeout(() => {
                    timeoutHint.style.display = 'block';
                }, 30000);
            }

            function stopTimers() {
                clearInterval(elapsedInterval);
                clearTimeout(timeoutHintTimer);
                elapsedTimer.style.display = 'none';
                timeoutHint.style.display = 'none';
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                
                const dialogue = input.value.trim();
                if (!dialogue) return;

                // Reset state
                errorBox.style.display = 'none';
                outputBox.classList.remove('visible');
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
                startTimers();

                try {
                    const response = await fetch("/summarize/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ dialogue }),
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.detail || `Server error: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    if (data.summary) {
                        summaryText.innerText = data.summary;
                        outputBox.classList.add('visible');
                        // Scroll to result smoothly
                        setTimeout(() => {
                            outputBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }, 100);
                    } else {
                        throw new Error("No summary returned from the server.");
                    }
                } catch (err) {
                    errorBox.innerText = `Error: ${err.message}`;
                    errorBox.style.display = 'block';
                } finally {
                    stopTimers();
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            });

            copyBtn.addEventListener('click', async () => {
                const text = summaryText.innerText;
                if (!text) return;

                try {
                    await navigator.clipboard.writeText(text);
                    const originalHTML = copyBtn.innerHTML;
                    copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!`;
                    copyBtn.style.color = '#22c55e';
                    copyBtn.style.borderColor = 'rgba(34, 197, 94, 0.3)';
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHTML;
                        copyBtn.style.color = '';
                        copyBtn.style.borderColor = '';
                    }, 2000);
                } catch (err) {
                    console.error('Failed to copy text: ', err);
                }
            });
        });
    </script>
</body>
</html>
